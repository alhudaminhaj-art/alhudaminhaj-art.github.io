<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اختبار المقاطع الصوتية</title>

  <style>
    body {
      margin: 0;
      padding: 25px 15px;
      background: #071b2c;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      color: #e8b84f;
      margin-bottom: 10px;
    }

    .note {
      text-align: center;
      color: #cbd5df;
      margin-bottom: 30px;
    }

    .card {
      background: #102d47;
      border: 1px solid #e8b84f;
      border-radius: 18px;
      padding: 18px;
      margin: 15px auto;
      max-width: 600px;
    }

    .title {
      color: #f2c766;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>

<h1>اختبار المقاطع الصوتية</h1>
<p class="note">اختبار المقاطع من 01 إلى 11</p>

<div id="audioList"></div>

<script>
  const container = document.getElementById("audioList");

  for (let i = 1; i <= 11; i++) {

    const number = String(i).padStart(2, "0");

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="title">المقطع الصوتي ${number}</div>

      <audio controls preload="none">
        <source src="audio-${number}.mp3.mp3" type="audio/mpeg">
        متصفحك لا يدعم تشغيل الصوت.
      </audio>
    `;

    container.appendChild(card);
  }
</script>

</body>
</html>
